<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Mathi</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
    </style>
</head>

<body>

<script>
(function () {

    const base = window.location.origin + window.location.pathname
        .replace(/\/index\.html?$/i, '')
        .replace(/\/$/, '');

    const pages = [
        'guard-app.html',
        'control_centre.html',
        'ranger-dashboard.html',
        'simulator.html'
    ];

    // Open all four pages
    pages.forEach((page) => {
        window.open(
            base + '/' + page,
            '_blank'
        );
    });

    // This page itself stays blank.
    // The four actual applications open in separate tabs.

})();
</script>

</body>
</html>
